<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紧急缓存清理 - AI知识库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #1e293b;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .warning {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 8px;
        }
        
        .warning-title {
            color: #92400e;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .warning-text {
            color: #78350f;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .info-box {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        
        .info-title {
            color: #1e293b;
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 16px;
        }
        
        .info-list {
            list-style: none;
            color: #475569;
            font-size: 14px;
            line-height: 1.8;
        }
        
        .info-list li {
            padding-left: 24px;
            position: relative;
            margin-bottom: 8px;
        }
        
        .info-list li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #10b981;
            font-weight: bold;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        button {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }
        
        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }
        
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        
        .status {
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .status.success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }
        
        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }
        
        .status-title {
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .status-text {
            font-size: 14px;
            line-height: 1.6;
        }
        
        .link {
            color: #8b5cf6;
            text-decoration: none;
            font-weight: 600;
        }
        
        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 紧急缓存清理</h1>
        <p class="subtitle">解决文档点击后持续轮询404错误的问题</p>
        
        <div class="warning">
            <div class="warning-title">
                ⚠️ 问题描述
            </div>
            <div class="warning-text">
                如果你点击文档后看到持续的网络请求错误（404），这是因为浏览器缓存了已删除的文档信息。
            </div>
        </div>
        
        <div class="info-box">
            <div class="info-title">此操作将清理：</div>
            <ul class="info-list">
                <li>浏览器 localStorage 中的所有数据</li>
                <li>浏览器 sessionStorage 中的所有数据</li>
                <li>所有缓存的API响应</li>
                <li>用户登录状态（需要重新登录）</li>
            </ul>
        </div>
        
        <div class="button-group">
            <button class="btn-primary" onclick="clearAllCache()">
                清理缓存并刷新
            </button>
            <button class="btn-secondary" onclick="goBack()">
                返回
            </button>
        </div>
        
        <div id="status" class="status"></div>
    </div>
    
    <script>
        function clearAllCache() {
            const statusEl = document.getElementById('status');
            
            try {
                // 清理 localStorage
                localStorage.clear();
                
                // 清理 sessionStorage
                sessionStorage.clear();
                
                // 显示成功消息
                statusEl.className = 'status success';
                statusEl.style.display = 'block';
                statusEl.innerHTML = `
                    <div class="status-title">✅ 缓存清理成功！</div>
                    <div class="status-text">
                        页面将在 2 秒后自动刷新...<br>
                        如果没有自动刷新，请手动刷新页面（Ctrl+Shift+R 或 Cmd+Shift+R）
                    </div>
                `;
                
                // 2秒后刷新页面
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
                
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.style.display = 'block';
                statusEl.innerHTML = `
                    <div class="status-title">❌ 清理失败</div>
                    <div class="status-text">
                        错误信息: ${error.message}<br><br>
                        请尝试手动清理：<br>
                        1. 按 F12 打开开发者工具<br>
                        2. 进入 Application/应用程序 标签<br>
                        3. 点击 "Clear storage" / "清除存储"<br>
                        4. 点击 "Clear site data" / "清除网站数据"
                    </div>
                `;
            }
        }
        
        function goBack() {
            window.history.back();
        }
        
        // 页面加载时显示当前缓存信息
        window.addEventListener('load', () => {
            console.log('=== 当前缓存信息 ===');
            console.log('localStorage 项数:', localStorage.length);
            console.log('sessionStorage 项数:', sessionStorage.length);
            
            // 列出所有 localStorage 键
            if (localStorage.length > 0) {
                console.log('localStorage 内容:');
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    console.log(`  ${key}:`, localStorage.getItem(key)?.substring(0, 100));
                }
            }
        });
    </script>
</body>
</html>
